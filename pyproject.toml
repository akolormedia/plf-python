[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plf"
version = "0.1.0"
description = "PLF (PromptLine Format) — parser, validator, writer, and query library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vector = [
    "lancedb>=0.6",
    "sentence-transformers>=2.2",
]
modelb = [
    "groq>=0.4",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["plf*"]

[tool.setuptools.package-data]
"plf.model_b" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
